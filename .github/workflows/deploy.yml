name: Deploy PayWave

# Push to main = test, build, create/update all AWS infrastructure with Terraform,
# build and push the web and API images, deploy both to EKS (the website and the API service run
# on Kubernetes; the payment transactions run in AWS Lambda), smoke test the public URLs, then install
# Prometheus + Grafana monitoring on the cluster (Grafana has its own load balancer address).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false # never cancel a half-finished infrastructure change

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT_NAME: paywave
  ENVIRONMENT: prod
  TF_IN_AUTOMATION: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend unit tests
        working-directory: backend
        run: npm test
      - name: Frontend unit tests (QR code encoder and decoder)
        run: node --test frontend/test/*.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_KEY" ] || [ -z "$AWS_SECRET" ]; then
            echo "::error::Add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY under Settings > Secrets and variables > Actions. See README.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Lambda package
        run: bash scripts/build-lambda.sh

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create Terraform state bucket (first run only)
        id: state
        run: bash scripts/bootstrap-state.sh

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ steps.state.outputs.bucket }}" \
            -backend-config="key=${PROJECT_NAME}/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform apply (VPC, EKS, RDS, Lambda, API Gateway, S3, IAM, CloudWatch)
        working-directory: terraform
        env:
          TF_VAR_project_name: ${{ env.PROJECT_NAME }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_smtp_host: ${{ secrets.SMTP_HOST }}
          TF_VAR_smtp_port: ${{ secrets.SMTP_PORT || '587' }}
          TF_VAR_smtp_user: ${{ secrets.SMTP_USER }}
          TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
          TF_VAR_smtp_from: ${{ secrets.SMTP_FROM }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: terraform apply -input=false -auto-approve

      - name: Read Terraform outputs
        working-directory: terraform
        run: |
          {
            echo "API_URL=$(terraform output -raw api_url)"
            echo "CLUSTER_NAME=$(terraform output -raw eks_cluster_name)"
            echo "ECR_URL=$(terraform output -raw ecr_repository_url)"
            echo "ECR_API_URL=$(terraform output -raw ecr_backend_repository_url)"
            echo "FRONTEND_BUCKET=$(terraform output -raw frontend_bucket)"
            echo "API_POD_ROLE_ARN=$(terraform output -raw api_pod_role_arn)"
            echo "DB_HOST=$(terraform output -raw db_host)"
            echo "DB_USER=$(terraform output -raw db_user)"
            echo "DB_NAME=$(terraform output -raw db_name)"
            echo "DB_SECRET_ARN=$(terraform output -raw db_secret_arn)"
            echo "APP_SECRET_ARN=$(terraform output -raw app_secret_arn)"
            echo "GRAFANA_ROLE_ARN=$(terraform output -raw grafana_role_arn)"
            echo "CLOUDFRONT_DOMAIN=$(terraform output -raw cloudfront_domain)"
          } >> "$GITHUB_ENV"
          # secret header value shared by CloudFront and nginx: keep it out of the logs
          ORIGIN_VERIFY="$(terraform output -raw origin_verify_secret)"
          echo "::add-mask::${ORIGIN_VERIFY}"
          echo "ORIGIN_VERIFY=${ORIGIN_VERIFY}" >> "$GITHUB_ENV"

      - name: Build and push the web and API images to ECR
        run: |
          ECR_REGISTRY="${ECR_URL%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          IMAGE="${ECR_URL}:${GITHUB_SHA::12}"
          docker build -t "$IMAGE" -t "${ECR_URL}:latest" frontend
          docker push "$IMAGE"
          docker push "${ECR_URL}:latest"
          API_IMAGE="${ECR_API_URL}:${GITHUB_SHA::12}"
          docker build -t "$API_IMAGE" -t "${ECR_API_URL}:latest" backend
          docker push "$API_IMAGE"
          docker push "${ECR_API_URL}:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"

      - name: Upload static files to S3
        run: |
          mkdir -p /tmp/site
          cp -r frontend/public/. /tmp/site/
          printf 'window.APP_CONFIG = {\n  API_BASE_URL: "/api",\n  PAYMENTS_API_URL: "%s",\n};\n' "$API_URL" > /tmp/site/config.js
          aws s3 sync /tmp/site "s3://${FRONTEND_BUCKET}/site/" --delete

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy to EKS
        id: k8s
        env:
          PAYMENTS_API_URL: ${{ env.API_URL }}
          LOG_OTP_WITHOUT_SMTP: ${{ secrets.SMTP_HOST == '' && 'true' || 'false' }}
        run: bash scripts/deploy-k8s.sh

      - name: Smoke test the payments API (Lambda)
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 30 "${API_URL}/health?deep=1"; then echo; exit 0; fi
            echo "Payments API not ready yet (attempt $i)"; sleep 15
          done
          echo "::error::Payments API (Lambda) health check failed"; exit 1

      - name: Smoke test the website (through CloudFront)
        run: |
          URL="https://${CLOUDFRONT_DOMAIN}"
          # A new CloudFront distribution needs a few minutes to roll out to the edge locations, and the
          # load balancer needs a moment to see healthy nodes. Retry for up to 20 minutes.
          for i in $(seq 1 80); do
            if curl -fsS --max-time 10 "${URL}/healthz" && curl -fsS --max-time 20 "${URL}/api/health?deep=1"; then
              {
                echo "## PayWave is live"
                echo ""
                echo "- **App: ${URL}**"
                echo "- Payments API (Lambda): ${API_URL}"
                echo "- API service (Kubernetes): ${URL}/api/health"
                if [ -z "${{ secrets.SMTP_HOST }}" ]; then
                  echo "- No SMTP secrets set: sign-up codes (OTP) are not emailed. Run Actions > Show sign-up codes to read them."
                fi
                echo "- CloudWatch dashboard: https://${AWS_REGION}.console.aws.amazon.com/cloudwatch/home?region=${AWS_REGION}#dashboards/dashboard/${PROJECT_NAME}-${ENVIRONMENT}"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "App is up: ${URL}"
              exit 0
            fi
            echo "Not ready yet (attempt $i)"; sleep 15
          done
          echo "::error::The app did not become reachable through CloudFront in 20 minutes"; exit 1

      # The app is already live and smoke tested at this point. Monitoring is an extra: if it
      # fails the run stays green and shows a warning (check the step log), instead of failing the deploy.
      - name: Deploy monitoring (Prometheus + Grafana)
        id: monitoring
        continue-on-error: true
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          KPS_VERSION: ${{ vars.KPS_VERSION }}
        run: bash scripts/deploy-monitoring.sh

      - name: Monitoring failed (app is still live)
        if: ${{ steps.monitoring.outcome == 'failure' }}
        run: |
          echo "::warning::Prometheus/Grafana did not install. PayWave itself is deployed and working. See the 'Deploy monitoring' step log, fix it, and re-run the workflow."

      - name: Monitoring summary (Grafana address and login)
        if: ${{ steps.monitoring.outcome == 'success' }}
        env:
          GRAFANA_URL: ${{ steps.monitoring.outputs.grafana_url }}
          GRAFANA_READY: ${{ steps.monitoring.outputs.grafana_ready }}
          PASSWORD_SET: ${{ secrets.GRAFANA_ADMIN_PASSWORD != '' }}
        run: |
          {
            echo ""
            echo "## Monitoring (Grafana)"
            echo ""
            echo "- **Open Grafana: ${GRAFANA_URL}**"
            echo "- User: \`admin\`"
            if [ "$PASSWORD_SET" = "true" ]; then
              echo "- Password: the value of your \`GRAFANA_ADMIN_PASSWORD\` secret"
            else
              PASS="$(kubectl -n monitoring get secret grafana-admin -o jsonpath='{.data.admin-password}' | base64 -d)"
              echo "- Password (generated, keep this repository private): \`${PASS}\`"
            fi
            if [ "$GRAFANA_READY" != "yes" ]; then
              echo "- The load balancer was still starting when this run ended. Wait 2-5 minutes and open the link again."
            fi
            echo ""
            echo "Dashboards are in the **PayWave** folder (Dashboards in the left menu):"
            echo ""
            echo "| Dashboard | What it monitors |"
            echo "|---|---|"
            echo "| 1. Website and API Health (Kubernetes) | Is the website API up, how fast, any errors |"
            echo "| 2. Payments, Lambda, API Gateway and Database (AWS) | Money transfers, card top-ups, recharge, AutoPay and the PostgreSQL database |"
            echo "| 3. Servers and Pods (Kubernetes cluster) | CPU, memory, disk and pods on the EKS servers |"
          } >> "$GITHUB_STEP_SUMMARY"
