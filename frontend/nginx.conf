server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  absolute_redirect off; # redirects stay relative, so they keep https behind CloudFront

  # In Kubernetes only CloudFront may use this server: it adds a secret X-Origin-Verify header, and
  # conf.d/00-origin.conf (a Kubernetes Secret) says which value is accepted. /healthz is open so the
  # load balancer health checks work. The copy baked into the image accepts everything (local development).
  if ($pw_origin_ok = 0) { return 403; }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Security headers. connect-src allows the API Gateway endpoint (and localhost for dev).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.amazonaws.com http://localhost:*; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # The Kubernetes API service (sign-up, profile, history, notifications ...). Money movement goes
  # from the browser straight to API Gateway + Lambda (PAYMENTS_API_URL in config.js).
  location /api/ {
    proxy_pass http://paywave-api.paywave.svc.cluster.local:3000/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 200k;
    add_header Cache-Control "no-store" always;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # config.js is generated per environment, never cache it
  location = /config.js {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.amazonaws.com http://localhost:*; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  # The live architecture page (frontend/architecture/index.html). It is one self-contained file with inline
  # script and style, so it gets its own CSP that allows 'self' and inline code, and nothing else. It reads no
  # cookies, calls no API and holds no data, and the strict CSP of the wallet app is unchanged.
  location = /architecture { return 301 /architecture/; }
  location /architecture/ {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.amazonaws.com http://localhost:*; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }
}
