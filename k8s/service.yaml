# NodePort, not LoadBalancer: nothing public is created by Kubernetes. Traffic comes from CloudFront through the
# Terraform-managed NLB (terraform/cloudfront.tf), which forwards to port 30080 on every node.
apiVersion: v1
kind: Service
metadata:
  name: paywave-web
  namespace: paywave
  labels:
    app: paywave-web
spec:
  type: NodePort
  selector:
    app: paywave-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080 # keep in sync with local.web_node_port in terraform/cloudfront.tf
