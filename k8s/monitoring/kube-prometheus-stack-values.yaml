# Helm values for kube-prometheus-stack: Prometheus + Grafana + node-exporter + kube-state-metrics.
# scripts/deploy-monitoring.sh fills ${AWS_REGION}, ${GRAFANA_ROLE_ARN} with envsubst.

# Alertmanager is off: CloudWatch alarms already email you (terraform/cloudwatch.tf). The Prometheus
# alert rules (k8s/monitoring/rules.yaml) still show up in Grafana > Alerting > Alert rules.
alertmanager:
  enabled: false

# EKS runs these control-plane parts for you; they cannot be scraped, so they would only show as "down".
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    # Pick up every ServiceMonitor / PodMonitor / PrometheusRule in the cluster (not only this chart's own)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    # No PersistentVolume: no EBS CSI driver needed and nothing is left behind on destroy.
    # Metrics older than the pod's life are lost when Prometheus restarts.
    resources:
      requests:
        cpu: 200m
        memory: 600Mi
      limits:
        memory: 1200Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      memory: 200Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 24Mi
    limits:
      memory: 64Mi

grafana:
  # Admin login comes from the "grafana-admin" Secret created by scripts/deploy-monitoring.sh
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # IRSA: lets Grafana read CloudWatch (Lambda, API Gateway, RDS) with no access keys
  serviceAccount:
    create: true
    name: grafana
    automountServiceAccountToken: true # the dashboard sidecar needs the API token
    annotations:
      eks.amazonaws.com/role-arn: "${GRAFANA_ROLE_ARN}"

  # Grafana gets its own public AWS Network Load Balancer (plain HTTP on port 80), separate from the website.
  # The address is printed in the job summary of the deploy. Login: user "admin" + the grafana-admin Secret.
  service:
    type: LoadBalancer
    port: 80
    # In-tree AWS cloud provider (no extra controller needed): "nlb" = Network Load Balancer, internet-facing by default
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

  grafana.ini:
    server:
      # Served from the root of its own load balancer address, no sub path
      serve_from_sub_path: false
    security:
      cookie_secure: false # the load balancer speaks plain HTTP
      allow_embedding: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
    live:
      max_connections: 0 # Grafana Live uses WebSockets, which are not needed here

  # Loads every ConfigMap labelled grafana_dashboard=1 (the PayWave dashboards) from any namespace
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      # Each dashboard ConfigMap names its folder in the "grafana_folder" annotation (PayWave dashboards go to "PayWave")
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

  additionalDataSources:
    - name: CloudWatch
      type: cloudwatch
      uid: cloudwatch
      access: proxy
      jsonData:
        authType: default
        defaultRegion: ${AWS_REGION}

  resources:
    requests:
      cpu: 50m
      memory: 150Mi
    limits:
      memory: 300Mi
