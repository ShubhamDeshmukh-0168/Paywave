# Prometheus alert rules for PayWave. They are visible in Grafana > Alerting > Alert rules.
# (Alertmanager is disabled; the email alarms are the CloudWatch ones from Terraform.)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: paywave
  namespace: paywave
  labels:
    app: paywave-api
spec:
  groups:
    - name: paywave.api
      rules:
        - alert: PayWaveApiDown
          expr: count(up{job="paywave-api"} == 1) < 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: No PayWave API pod is being scraped successfully
        - alert: PayWaveApiHigh5xxRate
          expr: |
            sum(rate(paywave_http_requests_total{status=~"5.."}[5m]))
              / clamp_min(sum(rate(paywave_http_requests_total[5m])), 0.001) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: More than 5% of API requests are failing with 5xx
        - alert: PayWaveApiSlow
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(paywave_http_request_duration_seconds_bucket[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: API p95 latency is above 1 second
        - alert: PayWavePodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="paywave"}[15m]) > 2
          labels:
            severity: warning
          annotations:
            summary: A PayWave container restarted more than twice in 15 minutes
